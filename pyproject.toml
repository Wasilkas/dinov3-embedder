[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "dinov3-embedder"
version = "0.1.0"
description = "Frozen DINOv3 ViT embeddings for images and bounding boxes"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "numpy>=1.24", "Pillow>=10", "torch>=2.5", "torchvision>=0.20",
    "transformers>=4.56,<6",
]

[project.optional-dependencies]
dev = ["pytest>=8", "build>=1", "ruff>=0.11", "mypy>=1.15"]

[project.scripts]
dinov3-embed = "dinov3_embedder.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
dinov3_embedder = ["py.typed"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]

[tool.ruff]
target-version = "py310"
line-length = 100
src = ["src"]
extend-exclude = ["outputs"]

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I", "UP"]

[tool.mypy]
python_version = "3.10"
files = ["src"]
mypy_path = "src"
check_untyped_defs = true
disallow_untyped_defs = true
disallow_any_generics = true
warn_return_any = true
warn_unused_ignores = true
warn_redundant_casts = true

[[tool.mypy.overrides]]
module = ["transformers", "transformers.*"]
follow_imports = "skip"
ignore_missing_imports = true
